name: Feature request
description: Suggest something Docnest should do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Only the first box is required. Write in whatever language you're comfortable with.

        > **Issues are public — don't paste document contents, license keys or secrets.**

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Tell us what got in the way. That helps more than a finished design.
      placeholder: When my agents write several plans at once, I …
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How should it work?
      description: Whatever comes to mind.
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: Docnest version
      description: Settings → About
      placeholder: "1.0.1 (19)"
    validations:
      required: false
