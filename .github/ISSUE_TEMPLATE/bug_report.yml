# Field ids app-version, macos-version and mac-model are prefilled by the Docnest app
# (issues/new?template=bug_report.yml&app-version=…&macos-version=…&mac-model=…). Keep them stable.
name: Bug report
description: Something in Docnest isn't working
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Only the first box is required, so skip anything you don't know. Write in whatever language you're comfortable with.

        > **Issues are public — don't paste document contents, license keys or secrets.**

        Can't describe the bug without private details? Email **hello@sanmarustudio.com**. Found a security problem? [Report it privately](https://github.com/Jeon0976/docnest-feedback/security/advisories/new) instead of opening an issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did Docnest do? A sentence or two is enough.
      placeholder: When I open the shelf, Docnest …
    validations:
      required: true

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: Make sure no document text or file names are showing.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, how?
      placeholder: |
        1. Ask Claude Code to write a plan
        2. …
    validations:
      required: false

  - type: dropdown
    id: ai-tool
    attributes:
      label: Which AI tool were you using?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Aside
        - Manus
        - Other
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: Docnest version
      description: Settings → About
      placeholder: "1.0.1 (19)"
    validations:
      required: false

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac
      placeholder: "macOS 15.3.2"
    validations:
      required: false

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      description: Not the serial number.
      placeholder: "MacBook Air M2"
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Advanced → Diagnostics → Copy diagnostics, then paste here. It contains no document contents.
      render: text
    validations:
      required: false
